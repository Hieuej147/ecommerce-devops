{{- end }}

{{- if .Values.inngest.enabled }}
---
#================== 11. In-Cluster Inngest Server ==================#
apiVersion: v1
kind: Service
metadata:
  name: inngest
  namespace: {{ .Values.namespace }}
  labels:
    app: inngest
spec:
  type: ClusterIP
  selector:
    app: inngest
  ports:
