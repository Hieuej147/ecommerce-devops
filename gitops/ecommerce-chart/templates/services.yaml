################################ SERVICES ################################

#================== 1. API Gateway ==================#
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
      protocol: TCP

---
#================== 2. Catalog Service (gRPC) ==================#
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: {{ .Values.namespace }}
  labels:
    app: catalog
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
    - name: grpc
      port: {{ .Values.catalog.port }}
      targetPort: {{ .Values.catalog.port }}
      protocol: TCP

---
