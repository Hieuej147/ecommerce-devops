################################ BACKEND DEPLOYMENTS ################################

#================== 1. API Gateway ==================#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image }}:{{ .Values.apiGateway.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          env:
            - name: PORT
              value: "{{ .Values.apiGateway.port }}"
            - name: CATALOG_GRPC_URL
              value: "catalog:{{ .Values.catalog.port }}"
            - name: ORDER_GRPC_URL
              value: "order:{{ .Values.order.port }}"
            - name: PAYMENT_GRPC_URL
              value: "payment:{{ .Values.payment.port }}"
            - name: USERS_GRPC_URL
              value: "users:{{ .Values.users.port }}"
            - name: CLERK_AUTHORIZED_PARTIES
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: CLERK_AUTHORIZED_PARTIES
            - name: AGENT_SERVICE_URL
              value: "http://agent-service:{{ .Values.agentService.port }}"
            - name: AGENT_INTERNAL_TOKEN
              value: "development-agent-token"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DATABASE_URL
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: CLERK_SECRET_KEY
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: CLERK_PUBLISHABLE_KEY
            - name: CLERK_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: CLERK_JWT_KEY
            - name: CLERK_WEBHOOK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: CLERK_WEBHOOK_SIGNING_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: INNGEST_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: INNGEST_SIGNING_KEY
            - name: INNGEST_EVENT_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: INNGEST_EVENT_KEY
            - name: INNGEST_BASE_URL
              value: "http://inngest:{{ .Values.inngest.port }}"
            - name: INNGEST_SERVE_ORIGIN
              value: "http://api-gateway:{{ .Values.apiGateway.port }}/v1/inngest"
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}

---
#================== 2. Catalog Service ==================#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: {{ .Values.namespace }}
  labels:
    app: catalog
spec:
  replicas: {{ .Values.catalog.replicas }}
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: "{{ .Values.catalog.image }}:{{ .Values.catalog.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.catalog.port }}
          env:
            - name: GRPC_PORT
              value: "{{ .Values.catalog.port }}"
            - name: CATALOG_GRPC_URL
              value: "0.0.0.0:{{ .Values.catalog.port }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}

